<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Construction Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 h-screen flex justify-start items-end p-0">

    <div class="w-full max-w-[480px] h-full bg-slate-900 rounded-none shadow-none p-4 sm:p-8 border-0 flex flex-col overflow-x-visible three-d mx-auto">
        <!-- LCD Screen -->
        <!-- LCD Screen: mode on top, what you typed, what it converts to -->
        <div class="lcd-bg relative rounded-lg p-2 md:p-4 shadow-inner mb-2 flex flex-col min-h-[230px] border-b-4 border-slate-700">
            <!-- What a bare typed number means, plus the history handle -->
            <div class="lcd-topbar">
                <button onclick="toggleHistory()" id="hist-btn" class="lcd-hist-btn" title="History" aria-label="History"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.8v5.4l3.6 2.1"/></svg></button>
                <div id="system-toggle" class="lcd-seg"></div>
                <div id="unit-chips" class="lcd-chips"></div>
            </div>

            <!-- History is summoned over the LCD rather than holding a slot in it -->
            <div id="history-display" class="lcd-history no-scrollbar"></div>

            <div class="flex-1 flex flex-col justify-end min-h-0">
                <div class="flex justify-end lcd-font min-h-[26px]">
                    <span id="top-display" class="inline-block text-right text-slate-900 bg-slate-800/10 px-2 rounded-lg text-lg md:text-2xl font-extrabold overflow-hidden whitespace-nowrap max-w-full"></span>
                </div>
                <div id="main-display" class="text-slate-900 lcd-font text-5xl md:text-7xl font-extrabold text-right tracking-tight overflow-x-visible overflow-y-hidden leading-none whitespace-pre py-2 pr-6">
                    0
                </div>
            </div>

            <!-- The same value in the other system -->
            <div id="conv-strip" class="lcd-conversions"></div>
        </div>

        <!-- Precision Toggle -->
        <div class="flex justify-center gap-2 mb-2 bg-slate-800/50 p-1 rounded-lg">
            <button onclick="setPrecision('dec')" id="prec-dec" class="flex-1 py-1 text-xs md:text-sm font-bold rounded bg-slate-700 text-slate-400 hover:text-white transition-colors border-0 shadow-none !text-[12px] uppercase">0.0</button>
            <button onclick="setPrecision(8)" id="prec-8" class="flex-1 py-1 text-xs md:text-sm font-bold rounded bg-slate-700 text-slate-400 hover:text-white transition-colors border-0 shadow-none !text-[12px] uppercase">1/8</button>
            <button onclick="setPrecision(16)" id="prec-16" class="flex-1 py-1 text-xs md:text-sm font-bold rounded bg-slate-700 text-slate-400 hover:text-white transition-colors border-0 shadow-none !text-[12px] uppercase">1/16</button>
            <button onclick="setPrecision(32)" id="prec-32" class="flex-1 py-1 text-xs md:text-sm font-bold rounded bg-slate-600 text-white transition-colors border-0 shadow-none !text-[12px] uppercase">1/32</button>
        </div>

        <!-- Keypad. The right column carries a second, FN-shifted unit label. -->
        <div class="grid grid-cols-4 grid-rows-[repeat(5,minmax(0,1fr))_auto] gap-1 flex-grow min-h-0">
            <button onclick="handleClear()" class="py-3 md:py-4 text-2xl md:text-3xl font-semibold rounded-lg bg-red-600 text-white hover:bg-red-500 active:scale-95 transition-transform">AC</button>
            <!-- & separates whole inches and fraction -->
            <button onclick="handleSpace()" title="whole inches / fraction separator" class="py-3 md:py-4 text-2xl md:text-3xl font-semibold rounded-lg bg-slate-500 text-white hover:bg-slate-400 active:scale-95 transition-transform">&</button>
            <!-- slash for fractions -->
            <button onclick="handleSlash()" class="py-2 md:py-3 text-xl md:text-2xl font-semibold rounded-lg bg-slate-500 text-white hover:bg-slate-400 active:scale-95 transition-transform">/</button>
            <button onclick="handleBackspace()" data-unit="in" class="fn-key py-2 md:py-3 text-xl md:text-2xl font-semibold rounded-lg bg-slate-600 text-white hover:bg-slate-500 active:scale-95 transition-transform"><span class="fn-legend"></span><span class="fn-main">⌫</span></button>

            <button onclick="handleDigit('7')" class="py-3 md:py-4 text-lg md:text-xl font-semibold rounded-lg bg-slate-200 text-slate-900 hover:bg-white active:scale-95 transition-transform">7</button>
            <button onclick="handleDigit('8')" class="py-3 md:py-4 text-lg md:text-xl font-semibold rounded-lg bg-slate-200 text-slate-900 hover:bg-white active:scale-95 transition-transform">8</button>
            <button onclick="handleDigit('9')" class="py-3 md:py-4 text-lg md:text-xl font-semibold rounded-lg bg-slate-200 text-slate-900 hover:bg-white active:scale-95 transition-transform">9</button>
            <button onclick="handleOperator('÷')" data-unit="ft" class="fn-key py-3 md:py-4 text-xl md:text-2xl font-semibold rounded-lg bg-slate-700 text-white hover:bg-slate-600 active:scale-95 transition-transform"><span class="fn-legend"></span><span class="fn-main">÷</span></button>

            <button onclick="handleDigit('4')" class="py-3 md:py-4 text-lg md:text-xl font-semibold rounded-lg bg-slate-200 text-slate-900 hover:bg-white active:scale-95 transition-transform">4</button>
            <button onclick="handleDigit('5')" class="py-3 md:py-4 text-lg md:text-xl font-semibold rounded-lg bg-slate-200 text-slate-900 hover:bg-white active:scale-95 transition-transform">5</button>
            <button onclick="handleDigit('6')" class="py-3 md:py-4 text-lg md:text-xl font-semibold rounded-lg bg-slate-200 text-slate-900 hover:bg-white active:scale-95 transition-transform">6</button>
            <button onclick="handleOperator('×')" data-unit="mm" class="fn-key py-3 md:py-4 text-xl md:text-2xl font-semibold rounded-lg bg-slate-700 text-white hover:bg-slate-600 active:scale-95 transition-transform"><span class="fn-legend"></span><span class="fn-main">×</span></button>

            <button onclick="handleDigit('1')" class="py-2 md:py-3 text-lg md:text-xl font-semibold rounded-lg bg-slate-200 text-slate-900 hover:bg-white active:scale-95 transition-transform">1</button>
            <button onclick="handleDigit('2')" class="py-2 md:py-3 text-lg md:text-xl font-semibold rounded-lg bg-slate-200 text-slate-900 hover:bg-white active:scale-95 transition-transform">2</button>
            <button onclick="handleDigit('3')" class="py-2 md:py-3 text-lg md:text-xl font-semibold rounded-lg bg-slate-200 text-slate-900 hover:bg-white active:scale-95 transition-transform">3</button>
            <button onclick="handleOperator('-')" data-unit="cm" class="fn-key py-2 md:py-3 text-xl md:text-2xl font-semibold rounded-lg bg-slate-700 text-white hover:bg-slate-600 active:scale-95 transition-transform"><span class="fn-legend"></span><span class="fn-main">-</span></button>

            <button onclick="handleEquals()" class="py-2 md:py-3 text-xl md:text-2xl font-semibold rounded-lg bg-amber-600 text-white hover:bg-amber-500 active:scale-95 transition-transform">=</button>
            <button onclick="handleDigit('0')" class="py-2 md:py-3 text-lg md:text-xl font-semibold rounded-lg bg-slate-200 text-slate-900 hover:bg-white active:scale-95 transition-transform">0</button>
            <button onclick="handleDigit('.')" class="py-2 md:py-3 text-lg md:text-xl font-black rounded-lg bg-slate-200 text-slate-900 hover:bg-white active:scale-95 transition-transform">.</button>
            <button onclick="handleOperator('+')" data-unit="m" class="fn-key py-2 md:py-3 text-xl md:text-2xl font-semibold rounded-lg bg-slate-700 text-white hover:bg-slate-600 active:scale-95 transition-transform"><span class="fn-legend"></span><span class="fn-main">+</span></button>

            <button onclick="toggleFn()" id="fn-key" class="col-span-4 h-10 rounded-lg bg-slate-700 text-amber-400 hover:bg-slate-600 active:scale-95 transition-transform border-0 shadow-none !text-[13px] font-bold uppercase tracking-widest">FN · Units</button>
        </div>
    </div>

    <script src="units.js"></script>
    <script src="calculator.js"></script>
</body>
</html>
